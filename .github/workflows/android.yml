name: Android build
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Install JavaScript dependencies
        run: npm install
      - name: Run extraction helper tests
        run: npm test
      - name: Bundle offline Bedrock LevelDB engine
        run: npm run build:engine
      - name: Build debug APK
        run: gradle :app:assembleDebug
      - name: Verify APK output
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk
      - name: Publish private debug APK release
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[publish-apk]')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="debug-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" app/build/outputs/apk/debug/app-debug.apk \
            --target "$GITHUB_SHA" \
            --title "MCPE Structure Extractor Debug ${GITHUB_RUN_NUMBER}" \
            --notes "Automated debug APK. Saved-structure extraction only. This build has not yet been validated against a real user-supplied Bedrock world." \
            --prerelease
